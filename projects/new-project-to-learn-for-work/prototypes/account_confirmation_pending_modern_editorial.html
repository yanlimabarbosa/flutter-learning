<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Hub - Account Confirmation</title>
    <link rel="stylesheet" href="./login_palette_base.css" />
    <style>
      :root {
        --page-bg: radial-gradient(circle at 50% 0%, rgba(139, 218, 255, 0.16), transparent 34%),
          linear-gradient(145deg, #0b0c0f, #101114 58%, #171b22);
        --bg: #101114;
        --surface: #181a20;
        --surface-strong: #20232b;
        --primary: #8bdaff;
        --accent: #f4c95d;
        --text: #f5f7fa;
        --muted: #a8afbd;
        --line: rgba(245, 247, 250, 0.12);
        --placeholder: #777f8f;
        --brand-bg: linear-gradient(135deg, var(--primary), #f8fcff);
        --brand-text: #081218;
        --pill-bg: rgba(139, 218, 255, 0.1);
        --feature-bg: linear-gradient(160deg, rgba(139, 218, 255, 0.18), transparent 58%),
          var(--surface-strong);
        --focus-ring: 0 0 0 3px rgba(139, 218, 255, 0.12);
        --button-text: #081218;
      }

      .message-card {
        margin-top: auto;
        padding: 18px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
      }

      .message-card p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <section class="screen">
        <header class="topbar">
          <div class="brand-mark">CH</div>
          <div class="status-pill">Check email</div>
        </header>

        <section class="hero">
          <p class="eyebrow">Almost There</p>
          <h1>Confirm your account.</h1>
          <p class="hero-copy">
            Open the confirmation link sent to your email to finish setting up your library.
          </p>
        </section>

        <section class="message-card" aria-label="Confirmation actions">
          <p>
            After confirming, return to the app and sign in to start saving courses and tracking lessons.
          </p>
          <div class="actions">
            <button class="primary-button">I confirmed my email</button>
            <button class="ghost-button">Resend email</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
