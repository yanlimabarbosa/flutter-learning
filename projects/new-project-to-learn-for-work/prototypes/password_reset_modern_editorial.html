<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Hub - Password Reset</title>
    <link rel="stylesheet" href="./login_palette_base.css" />
    <style>
      :root {
        --page-bg: radial-gradient(circle at 50% 0%, rgba(139, 218, 255, 0.16), transparent 34%),
          linear-gradient(145deg, #0b0c0f, #101114 58%, #171b22);
        --bg: #101114;
        --surface: #181a20;
        --surface-strong: #20232b;
        --primary: #8bdaff;
        --accent: #f4c95d;
        --text: #f5f7fa;
        --muted: #a8afbd;
        --line: rgba(245, 247, 250, 0.12);
        --placeholder: #777f8f;
        --brand-bg: linear-gradient(135deg, var(--primary), #f8fcff);
        --brand-text: #081218;
        --pill-bg: rgba(139, 218, 255, 0.1);
        --feature-bg: linear-gradient(160deg, rgba(139, 218, 255, 0.18), transparent 58%),
          var(--surface-strong);
        --focus-ring: 0 0 0 3px rgba(139, 218, 255, 0.12);
        --button-text: #081218;
      }

      .reset-panel {
        margin-top: auto;
        padding: 18px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <section class="screen">
        <header class="topbar">
          <div class="brand-mark">CH</div>
          <div class="status-pill">Account help</div>
        </header>

        <section class="hero">
          <p class="eyebrow">Reset Password</p>
          <h1>Get back to your library.</h1>
          <p class="hero-copy">
            Enter your account email and we will send instructions to recover access.
          </p>
        </section>

        <section class="reset-panel" aria-label="Password reset form">
          <input class="field" type="email" placeholder="Email" />
          <div class="actions">
            <button class="primary-button">Send recovery link</button>
            <button class="ghost-button">Back to sign in</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
